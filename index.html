<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hantelhelden</title>
  <meta name="theme-color" content="#14161b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
  <header class="top">
    <div class="brand">⚡ Hantel<small>helden</small> <i id="sync-dot" title="Online-Verbindung"></i></div>
    <div class="players" id="players"></div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-act="tab" data-arg="jagd"><span>🐷</span>Jagd</button>
    <button data-act="tab" data-arg="held"><span>🦾<i id="spar-badge" class="tab-badge"></i></span>Held</button>
    <button data-act="tab" data-arg="mehr"><span>☰</span>Mehr</button>
  </nav>

  <div id="overlay"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=17"></script>
  <script type="module" src="sync.js?v=17"></script>
</body>
</html>
