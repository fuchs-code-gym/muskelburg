<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Muskelburg – Arena</title>
  <meta name="theme-color" content="#9a5b22">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">⚔️ Muskelburg <small>Arena</small> <i id="sync-dot" title="Online-Verbindung"></i></div>
    <div class="players" id="players"></div>
    <div class="resbar" id="resbar"></div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-act="tab" data-arg="training"><span>💪</span>Training</button>
    <button data-act="tab" data-arg="held"><span>🦸</span>Held</button>
    <button data-act="tab" data-arg="arena"><span>⚔️<i id="arena-badge" class="tab-badge"></i></span>Arena</button>
    <button data-act="tab" data-arg="rang"><span>🏆</span>Rangliste</button>
    <button data-act="tab" data-arg="profil"><span>🏅</span>Profil</button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
